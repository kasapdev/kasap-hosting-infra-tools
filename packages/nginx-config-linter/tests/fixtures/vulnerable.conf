http {
    server {
        listen 80;
        listen 80;
        server_name example.com;

        location /files {
            autoindex on;
            root /var/www/files;
        }
    }

    server {
        listen 443 ssl;
        server_name secure.example.com;

        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;

        location / {
            proxy_pass http://backend;
        }
    }
}
